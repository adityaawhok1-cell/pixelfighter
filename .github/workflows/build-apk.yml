name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Siapkan game
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install dependencies
        run: npm install

      - name: Tambah platform Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      # Kunci tanda tangan TETAP -> APK baru bisa menimpa yang lama tanpa uninstall
      - name: Pakai keystore tetap
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      # Nomor versi naik otomatis tiap build
      - name: Naikkan versionCode
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: pixel-fighter-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
